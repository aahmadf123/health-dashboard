name: CI

# Deployment runs from main. This runs the same fast checks on a pull request,
# so a branch is validated before it merges rather than at deploy time.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Typechecks the app and the Worker. The Worker project needs the
      # generated Env types, which the build's prebuild step writes.
      - run: npm run cf-typegen
      - run: npx tsc -b
      - run: npm run build
